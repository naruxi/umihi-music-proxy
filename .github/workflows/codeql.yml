name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["dev"]
  schedule:
    - cron: "30 7 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PROJECT_MODULE: app
  STORE_FILE: release-key.jks

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Change wrapper permissions
        if: matrix.language == 'java-kotlin'
        run: chmod +x ./gradlew

      # The proxy core is a 112 MB gomobile AAR that is not in git; without it every
      # Gradle task that touches the runtime classpath fails to resolve.
      - name: Fetch libbox proxy core
        if: matrix.language == 'java-kotlin'
        run: chmod +x ./scripts/fetch-libbox.sh && ./scripts/fetch-libbox.sh
        env:
          LIBBOX_VERSION: "1.14.3"

      - name: Detect signing secrets
        id: signing
        if: matrix.language == 'java-kotlin'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Keystore
        if: matrix.language == 'java-kotlin' && steps.signing.outputs.enabled == 'true'
        run:
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ env.MAIN_PROJECT_MODULE }}/${{
          env.STORE_FILE }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}

      - name: Create keystore.properties
        if: matrix.language == 'java-kotlin' && steps.signing.outputs.enabled == 'true'
        run: |
          echo "storeFile=${{ env.STORE_FILE }}" > keystore.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'java-kotlin'
        # Debug keeps the scan independent of signing keys and R8, both of which only
        # affect packaging. CodeQL needs compiled bytecode, not a signed APK.
        run: ./gradlew assembleStandaloneDebug -Pbeta=true -PgitHash=${{ github.sha }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
